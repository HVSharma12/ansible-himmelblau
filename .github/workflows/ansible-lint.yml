---
name: Ansible Lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

# Least privilege: the job only reads the tree and runs linters. Without this the token
# inherits the repository/organisation default, which is often read/write.
permissions:
  contents: read

jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip3 install ansible==11.3.0
          pip3 install ansible-core==2.18.3
          pip3 install ansible-lint==26.1.1
          pip3 install yamllint==1.35.1

      # ansible-lint excludes examples/, so without this step the shipped example playbooks
      # would have no CI coverage at all. Both linters are the declared standard.
      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml .

      # --offline: the collections are already present via the pinned ansible package, so the
      # linter must not resolve anything over the network while linting a pull request.
      - name: Run ansible-lint
        run: |
          ansible-lint --offline -v
