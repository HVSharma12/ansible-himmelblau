---
# defaults/main.yml — public API for ansible-himmelblau.
# Every variable here MUST be documented in README.md.

# Entra ID domain to authenticate against (e.g. "example.onmicrosoft.com"). REQUIRED for Entra;
# optional only when himmelblau_oidc_issuer_url is set, because OIDC users need not sign in with a
# UPN. Himmelblau does NOT infer it from the first user's UPN. Rendered only when set.
himmelblau_domain: ""

# Application (client) ID: the OIDC client id, REQUIRED with himmelblau_oidc_issuer_url. Entra
# rarely needs it (group enumeration, extended attributes). Rendered only when set.
himmelblau_app_id: ""

# OIDC issuer URL; setting it selects generic OIDC, empty means Entra. Must match the
# provider's advertised issuer exactly. Requires himmelblau_app_id. Rendered only when set.
himmelblau_oidc_issuer_url: ""

# Users and groups allowed to log in: Entra group Object IDs and/or UPNs; for OIDC,
# claim values on Himmelblau >= 4.0, else users (no group claims before). Empty = all.
himmelblau_pam_allow_groups: []

# Local groups Himmelblau users are added to (e.g. ["wheel"] or ["sudo"]).
himmelblau_local_groups: []

# POSIX UID/GID mapping range.
himmelblau_idmap_range: "200000-2000200000"

# Default login shell for mapped users.
himmelblau_shell: "/bin/bash"

# Windows-Hello PIN enrollment (upstream default true). Set false if the OIDC client does not
# allow refresh tokens; offline_access is needed for the login regardless. See "Generic OIDC".
himmelblau_enable_hello: true

# Home-directory layout (rendered only when set; empty = himmelblau's own default).
# home_attr upstream default uuid; home_alias spn; home_prefix e.g. /home/.
himmelblau_home_attr: ""
himmelblau_home_alias: ""
himmelblau_home_prefix: ""

# Optional separate app (client) ID for logon-token scopes. Rendered only when set.
himmelblau_logon_token_app_id: ""

# Optional path to an external name-mapping file. The role writes only this key;
# it does not manage the file's contents. Rendered only when set.
himmelblau_user_map_file: ""

# Any additional [global] himmelblau.conf keys, merged verbatim (key: value).
# Keys promoted to typed vars above take precedence over the same key here.
himmelblau_extra_config: {}

# present|absent — install/configure, or remove the role's managed state.
himmelblau_state: present

# Transactional-update systems only (SLE 16.1 Immutable / SL Micro): package changes are staged
# into a new snapshot and need a reboot to become live. true = the role reboots the
# host when a package transaction was staged; false = notify only, the operator reboots later —
# note the NSS/PAM wiring of the SAME run then acts on not-yet-live packages and fails at
# pam-config, so pair false with configure_nss/pam: false (staged rollout) and re-run after the
# reboot; unset (null, the default) = fail so the reboot requirement is a conscious decision.
# Ignored on non-transactional systems.
himmelblau_transactional_update_reboot_ok: null

# Configure NSS (/etc/nsswitch.conf) for himmelblau resolution.
himmelblau_configure_nss: true

# Configure the PAM stack (via pam-config on SUSE). Lock-out risk — see README.
himmelblau_configure_pam: true

# Accept allow-all login. Default false: a present run, with or without configure_pam, refuses
# unless himmelblau_pam_allow_groups scopes login. See the README.
himmelblau_pam_allow_no_groups: false

# Start (and restart on change) the himmelblau daemons. Default true. Set false to
# enable but not start them — e.g. deploy config before an Entra tenant is reachable,
# or in tenant-less CI. Activation needs a working tenant; see README.
himmelblau_start_services: true

# Opt-in SSH server enrolment: install the himmelblau sshd config so Entra users can
# authenticate over SSH. Default false (enabling SSH auth on a fleet is a lock-out
# vector; upstream already denies SSH password-only by default). See README.
himmelblau_configure_ssh: false

# Entra group GUIDs whose members get sudo (rendered with local_sudo_group when set).
himmelblau_sudo_groups: []
# Local group sudo_groups members are placed into (rendered only when sudo_groups set).
himmelblau_local_sudo_group: "sudo"

# Opt-in offline break-glass (emergency offline MFA bypass). Renders an
# [offline_breakglass] section only when enabled; ttl is in seconds.
himmelblau_offline_breakglass_enabled: false
himmelblau_offline_breakglass_ttl: 7200

# Package list defaults to the distro value from vars/<distro>.yml; override here only to pin or
# customize. The packages come from the registered SLE 16.1 base product.
himmelblau_packages: "{{ __himmelblau_packages }}"
