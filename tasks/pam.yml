---
# tasks/pam.yml — wire the PAM stack (present) or remove it (absent).
# ⚠️ A broken PAM stack can lock you out. Keep a root rescue shell when testing.

# The login-scoping guard is a pre-flight assert in main.yml so a misconfig aborts
# before any package/NSS change. By the time we get here, login scoping is already validated.

- name: Configure PAM via pam-config (SUSE)
  when: __himmelblau_pam_method == "pam-config"
  block:
    - name: Query current himmelblau PAM state
      ansible.builtin.command: pam-config --query --himmelblau
      register: __himmelblau_pam_query
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Enable himmelblau in the PAM stack
      ansible.builtin.command: pam-config --add --himmelblau
      when:
        - himmelblau_state == "present"
        - __himmelblau_pam_query.stdout | trim | length == 0
      changed_when: true

    - name: Remove himmelblau from the PAM stack
      ansible.builtin.command: pam-config --delete --himmelblau
      when:
        - himmelblau_state == "absent"
        - __himmelblau_pam_query.stdout | trim | length > 0
      changed_when: true

    # ACCOUNT CONTROL. pam-config < 2.14
    # hardcodes `account required pam_himmelblau.so ignore_unknown_user`; upstream declares
    # `[success=ok auth_err=die default=ignore]` for that line and himmelblau >= 3.1.12 rewrites
    # `required`/`sufficient` to it on package upgrade, so the role writes the same control.
    # Semantics, per the module's own return codes:
    #   - out-of-group Entra user  -> PAM_AUTH_ERR -> die: denied, terminally (scoping holds);
    #   - in-group Entra user      -> PAM_SUCCESS  -> ok: continues to pam_unix, which succeeds on
    #     the NSS synthetic shadow entry himmelblau >= 3.1.8 serves (SLE 16.1 ships 3.1.11);
    #   - local user / daemon down -> PAM_IGNORE   -> ignore: pam_unix decides, as before — the
    #     lock-out invariant is unchanged.
    # Matches `required` (pam-config's output) AND `sufficient` (a host converged by v1.x, where
    # synthetic shadow entries turned `sufficient` into a login-scoping bypass), so re-converging
    # repairs both. The `[success=end …]` item is the plugin file's own 3.1.11 wording (upstream
    # changed `end` to `ok` in 3.1.12): a pam-config >= 2.14 that honoured the plugin file while
    # himmelblau was still < 3.1.12 would emit `end`, which is not a control action pamd or
    # Linux-PAM accepts — pamd validates the WHOLE file on every call, so an unmatched `end` line
    # would hard-fail this task instead of being repaired. It is listed FIRST because pamd
    # validates after the rewrite, so it must be corrected before a later item re-reads the file.
    # Idempotent: once the line carries the target control none of the three patterns match. On
    # SLE16 common-account is a symlink to common-account-pc, so this lands in the pam-config-owned
    # file and is re-applied every converge (an external pam-config run regenerates `required` —
    # still safe — until the next converge). On absent, pam-config --delete removes the line, so
    # there is nothing to revert. Note: a check-mode run on a not-yet-wired host reports this task
    # ok (the pam-config --add above is skipped, so there is no himmelblau line to match) — that ok
    # does not mean the host is already converged.
    - name: Set the himmelblau account line to the upstream-declared control
      community.general.pamd:
        name: common-account
        type: account
        control: "{{ __himmelblau_legacy_control }}"
        module_path: pam_himmelblau.so
        new_control: "[success=ok auth_err=die default=ignore]"
      loop:
        - "[success=end auth_err=die default=ignore]"
        - required
        - sufficient
      loop_control:
        loop_var: __himmelblau_legacy_control
      when: himmelblau_state == "present"

- name: Fail when PAM wiring is not implemented for this platform
  ansible.builtin.fail:
    msg: >-
      PAM configuration is only implemented via pam-config (SUSE).
      Set himmelblau_configure_pam=false and wire PAM yourself on this platform.
  # Present-only: on absent there is no role-managed PAM to revert for an unsupported
  # method, so teardown must be a clean no-op rather than abort.
  when:
    - himmelblau_state == "present"
    - __himmelblau_pam_method != "pam-config"
