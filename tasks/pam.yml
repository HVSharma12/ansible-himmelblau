---
# tasks/pam.yml — wire the PAM stack (present) or remove it (absent).
# ⚠️ A broken PAM stack can lock you out. Keep a root rescue shell when testing.

# The login-scoping guard is a pre-flight assert in main.yml so a misconfig aborts
# before any package/NSS change. By the time we get here, login scoping is already validated.

- name: Configure PAM via pam-config (SUSE)
  when: __himmelblau_pam_method == "pam-config"
  block:
    - name: Query current himmelblau PAM state
      ansible.builtin.command: pam-config --query --himmelblau
      register: __himmelblau_pam_query
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Enable himmelblau in the PAM stack
      ansible.builtin.command: pam-config --add --himmelblau
      when:
        - himmelblau_state == "present"
        - __himmelblau_pam_query.stdout | trim | length == 0
      changed_when: true

    - name: Remove himmelblau from the PAM stack
      ansible.builtin.command: pam-config --delete --himmelblau
      when:
        - himmelblau_state == "absent"
        - __himmelblau_pam_query.stdout | trim | length > 0
      changed_when: true

    # WORKAROUND: pam-config < 2.14 hardcodes
    # the himmelblau account line as `account required pam_himmelblau.so` — a deliberate built-in;
    # it never reads the plugin file (/usr/lib/pam-config.d/himmelblau.conf) that declares
    # `sufficient`. With `required`, the next line `account required pam_unix.so` returns
    # AUTHINFO_UNAVAIL for an Entra user (no /etc/shadow entry) and the whole account phase
    # fails — so NO Entra user can log in (login/su/sshd all die there; proven live 2026-07-07).
    # We restore the control the upstream plugin declares. Safe: himmelblau's acct_mgmt itself
    # enforces pam_allow_groups — out-of-group → PAM_AUTH_ERR, so `sufficient` does not let them
    # through; source-verified. On SLE16 common-account is a symlink to
    # common-account-pc, so this lands in the pam-config-owned file and is re-applied every
    # converge (an external pam-config run reverts it). Fixed upstream twice — pam-config >= 2.14
    # emits the declared `sufficient`, and himmelblau >= 3.1.8 serves NSS synthetic shadow
    # entries — so this task self-disables on fixed hosts: pamd only matches a `required`
    # himmelblau account line (also what keeps it idempotent). On absent, pam-config --delete
    # removes the line, so there is nothing to revert.
    - name: Enforce the plugin-declared 'sufficient' account control (pam-config < 2.14)
      community.general.pamd:
        name: common-account
        type: account
        control: required
        module_path: pam_himmelblau.so
        new_control: sufficient
      when: himmelblau_state == "present"

- name: Fail when PAM wiring is not implemented for this platform
  ansible.builtin.fail:
    msg: >-
      PAM configuration is only implemented via pam-config (SUSE).
      Set himmelblau_configure_pam=false and wire PAM yourself on this platform.
  # Present-only: on absent there is no role-managed PAM to revert for an unsupported
  # method, so teardown must be a clean no-op rather than abort.
  when:
    - himmelblau_state == "present"
    - __himmelblau_pam_method != "pam-config"
