---
# tasks/repo.yml — add the Himmelblau package repository (present) or remove it (absent).
# Teardown removes the repo so `absent` leaves no orphaned third-party package source.

- name: Add the network:idm repository (SUSE)
  community.general.zypper_repository:
    repo: "{{ himmelblau_repo_url }}"
    # TOFU: the OBS signing key is auto-imported over HTTPS on first refresh. Pinning the network
    # idm key (rpm_key + auto_import_keys:false) is a documented hardening follow-up.
    auto_import_keys: true
    state: present
  when:
    - himmelblau_state == "present"
    - ansible_facts['os_family'] == "Suse"

# Remove by alias, not URL: zypper stores the expanded baseurl, which differs from the .repo URL
# used to add it, so state:absent must match the [network_idm] alias. No-op if never added.
- name: Remove the network:idm repository (SUSE) on teardown
  community.general.zypper_repository:
    name: "{{ __himmelblau_repo_alias }}"
    state: absent
  when:
    - himmelblau_state == "absent"
    - ansible_facts['os_family'] == "Suse"

# Other distro families add their repo handling here as the role grows. Present-only: on absent
# there is no role-managed repo to remove for an unsupported family, so teardown stays a no-op.
- name: Fail on unsupported distro for repo management
  ansible.builtin.fail:
    msg: >-
      Repository management is only implemented for SUSE so far.
      Set himmelblau_manage_repo=false and provide packages another way.
  when:
    - himmelblau_state == "present"
    - ansible_facts['os_family'] != "Suse"
