---
# tasks/main.yml — entry point. Present installs + configures; absent reverses it:
# revert config/NSS/PAM and stop services (while the units still exist), then remove
# packages — so removal never leaves orphaned PAM/NSS references.

# The distro dispatch below dereferences ansible_facts['distribution'|'distribution_version'|
# 'os_family']. A parent playbook run with gather_facts: false would otherwise fail here with an
# opaque undefined-variable error before any of the role's clear pre-flight asserts. Gather just the
# distribution subset if it is missing. No-op when facts exist.
- name: Ensure the distribution facts the role dispatches on are present
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution
  when: ansible_facts['distribution'] is not defined

- name: Set platform/version specific variables
  ansible.builtin.include_vars: "{{ __vars_file }}"
  loop: "{{ q('first_found', __params) }}"
  loop_control:
    loop_var: __vars_file
  vars:
    __params:
      files:
        - "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true

# Transactional hosts (SLE 16.1 Immutable / SL Micro) stage package changes into a new snapshot
# that only becomes live after a reboot. Detection follows the LSR pattern and is guarded so
# tests can inject the flag.
- name: Determine if system is transactional update and set flag
  when: not __himmelblau_is_transactional is defined
  block:
    - name: Check if transactional-update exists in /sbin
      ansible.builtin.stat:
        path: /sbin/transactional-update
      register: __himmelblau_transactional_update_stat

    - name: Set flag if transactional-update exists
      ansible.builtin.set_fact:
        __himmelblau_is_transactional: "{{ __himmelblau_transactional_update_stat.stat.exists }}"

- name: Validate himmelblau_state
  ansible.builtin.assert:
    that:
      - himmelblau_state in ['present', 'absent']
    fail_msg: >-
      himmelblau_state must be 'present' or 'absent' (got '{{ himmelblau_state }}'). A typo would
      otherwise drive a silent partial teardown (install/configure skip, services stop).
    quiet: true

# Supported-platform guard. The role installs from the SLE 16.1 base product, so an older release
# has no source for the packages at all. os_family alone is NOT enough: SLE 15.x, SLE 16.0, Leap
# and Tumbleweed are all "Suse", pass every other assert, and would otherwise reach install.yml
# and die on the package manager's own error. "SL-Micro" is how Ansible reports the SLE 16.1
# Immutable (transactional) variant — supported under the transactional reboot contract, so it is
# admitted here. Present-only, so teardown of a host wired by an older release still works.
- name: Assert the target is a supported platform (SLE 16.1 or later)
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ["SLES", "SL-Micro"]
      - ansible_facts['distribution_version'] is version('16.1', '>=')
    fail_msg: >-
      This role supports SLES 16.1+ and SL-Micro 16.1+ (the Immutable variant) only — it installs
      Himmelblau from the SLE 16.1 base product and adds no repository. This host is
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
      For SLE 15.x / SLE 16.0 / openSUSE, use the v1.x series, which manages the network:idm
      repository. Ansible reports the SAP and Desktop variants as SLES_SAP / SLED, which this
      role does not claim support for and has never been tested on; if you are on such a 16.1
      host and want to proceed anyway, the packages resolve the same way — set
      himmelblau_packages yourself and wire PAM with configure_pam=false, or raise an issue.
      Registration with the SUSE Customer Center (or an RMT/SMT mirror) is also required —
      without it the packages will not resolve.
    quiet: true
  when: himmelblau_state == "present"

# The IdP mode is not a variable: Himmelblau derives it from oidc_issuer_url alone — set, and it
# authenticates against that OIDC provider; unset, and it uses its native Entra flow. So the role
# validates the same way, rather than through a provider switch of its own.
- name: Assert the OIDC client id is set when an OIDC issuer is configured
  ansible.builtin.assert:
    that:
      - not (himmelblau_oidc_issuer_url | length > 0 and himmelblau_app_id | length == 0)
    fail_msg: >-
      himmelblau_oidc_issuer_url is set, so himmelblau_app_id is required — Himmelblau uses it as
      the OIDC client id. Leave the issuer empty to authenticate against Entra instead.
    quiet: true
  when: himmelblau_state == "present"

# domain is REQUIRED for Entra and optional only when authenticating via OIDC, because OIDC users
# need not sign in with a UPN. It is NOT inferred from the first user's UPN — upstream's
# own domain.xml says both, and the maintainer confirmed the inference half is wrong.
- name: Assert an identity anchor is configured
  ansible.builtin.assert:
    that:
      - himmelblau_domain | length > 0 or himmelblau_oidc_issuer_url | length > 0
    fail_msg: >-
      Set himmelblau_domain — required to authenticate against Entra ID — or
      himmelblau_oidc_issuer_url to authenticate against a generic OIDC provider (with which
      domain is optional). A config with neither has no identity anchor and cannot authenticate
      anyone.
    quiet: true
  when: himmelblau_state == "present"

# Pre-flight login-scoping guard: only pam_allow_groups scopes who can log in (unset =
# allow-all). Admin groups (local_groups/sudo_groups) are post-login membership/sudo and do NOT
# scope login. Refuse to wire PAM with unscoped login unless allow-all is explicitly accepted —
# run here, before install/NSS, so a misconfig aborts with no partial state.
- name: Refuse to wire PAM with unscoped login
  ansible.builtin.assert:
    that:
      - himmelblau_pam_allow_groups | length > 0 or himmelblau_pam_allow_no_groups | bool
    fail_msg: >-
      Refusing to configure PAM with unscoped login: with himmelblau_pam_allow_groups empty, EVERY
      Entra tenant user can authenticate to this host. Admin groups (himmelblau_local_groups /
      himmelblau_sudo_groups) only grant membership/sudo AFTER login — they do NOT restrict who can
      log in. Set himmelblau_pam_allow_groups to scope login, or himmelblau_pam_allow_no_groups=true
      to consciously accept allow-all. This guard reads only the typed himmelblau_pam_allow_groups —
      scoping via himmelblau_extra_config.pam_allow_groups does NOT satisfy it (use the typed var).
      Keep a root rescue shell open.
    quiet: true
  when:
    - himmelblau_state == "present"
    - himmelblau_configure_pam | bool
    # Only where PAM is actually wired (pam-config is the sole implemented method). On other
    # platforms (__himmelblau_pam_method == "manual") PAM wiring is unsupported and pam.yml
    # emits a clearer "set configure_pam=false and wire PAM yourself" error — let that surface
    # instead of the login-scoping abort. Trading away the original method-agnostic guard was
    # accepted deliberately.
    - __himmelblau_pam_method == "pam-config"

# The packages ship in the SLE 16.1 base product, so a registered host already resolves them —
# there is no repository for the role to manage.
- name: Install packages
  ansible.builtin.include_tasks: install.yml
  when: himmelblau_state == "present"

# The staged transaction must be live before configure/NSS/PAM run — pam-config reads profile
# files the packages provide, and on a transactional host they exist only in the new snapshot
# until the reboot.
- name: Handle reboot for transactional update systems (package install)
  ansible.builtin.include_tasks: transactional_reboot.yml
  when:
    - himmelblau_state == "present"
    - __himmelblau_is_transactional | d(false)
    - __himmelblau_package_result is defined
    - __himmelblau_package_result is changed

- name: Configure himmelblau (render on present, remove on absent)
  ansible.builtin.include_tasks: configure.yml

# Teardown is flag-independent: on `absent` we always run nss.yml/pam.yml so that a host
# wired with configure_nss/configure_pam=true is still cleanly unwired even if the toggle
# has since drifted to false — the revert tasks are self-guarding no-ops.
- name: Configure NSS (wire on present, unwire on absent)
  ansible.builtin.include_tasks: nss.yml
  when: himmelblau_configure_nss | bool or himmelblau_state == "absent"

- name: Configure PAM (add on present, remove on absent)
  ansible.builtin.include_tasks: pam.yml
  when: himmelblau_configure_pam | bool or himmelblau_state == "absent"

- name: Configure SSH server enrolment (opt-in; teardown-independent on absent)
  ansible.builtin.include_tasks: ssh.yml
  when: himmelblau_configure_ssh | bool or himmelblau_state == "absent"

- name: Manage services
  ansible.builtin.include_tasks: service.yml

- name: Remove packages (after services stopped and PAM/NSS/config reverted)
  ansible.builtin.include_tasks: install.yml
  when: himmelblau_state == "absent"

# On absent the staged removal (main set and/or the sshd-config package from ssh.yml) is also not
# live until reboot. PAM/NSS were already unwired live above, so login safety does not depend on
# this — the reboot just makes the package removal effective.
- name: Handle reboot for transactional update systems (package removal)
  ansible.builtin.include_tasks: transactional_reboot.yml
  when:
    - himmelblau_state == "absent"
    - __himmelblau_is_transactional | d(false)
    - >-
      (__himmelblau_package_result is defined and __himmelblau_package_result is changed)
      or (__himmelblau_sshd_package_result is defined
          and __himmelblau_sshd_package_result is changed)
