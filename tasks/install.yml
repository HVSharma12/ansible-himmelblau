---
# tasks/install.yml — install or remove Himmelblau packages.

- name: "Ensure Himmelblau packages are {{ himmelblau_state }}"
  ansible.builtin.package:
    name: "{{ himmelblau_packages }}"
    state: "{{ 'present' if himmelblau_state == 'present' else 'absent' }}"
  # On a transactional host a changed result means the transaction was STAGED into a new
  # snapshot, not applied — main.yml keys the reboot contract on this register.
  register: __himmelblau_package_result

# zypper answers from the pending snapshot, so on a re-run a staged package reads as installed
# although it is not live yet; the live rpm database tells.
- name: Check whether the packages are live on a transactional update system
  ansible.builtin.command:  # noqa command-instead-of-module
    argv: "{{ ['rpm', '-q', '--whatprovides'] + himmelblau_packages }}"
  environment:
    LC_ALL: C
  register: __himmelblau_packages_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: __himmelblau_is_transactional | d(false)
