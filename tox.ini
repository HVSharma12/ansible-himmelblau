[tox]
# tox-lsr provides the real environments (black, yamllint, ansible-lint, qemu-*).
# Install it with:  pip install git+https://github.com/linux-system-roles/tox-lsr@main
#
# Then run:
#   tox                            # the lint envlist below
#   tox -e qemu-ansible-core-2-18 -- --image-name <image> tests/tests_*.yml
#
# The ansible-lint env needs `yq` on PATH — tox-lsr's helper uses it to merge
# meta/collection-requirements.yml — and fails with "yq: command not found" without it. The GitHub
# workflow runs ansible-lint directly instead, so CI does not need it.
#
# The integration env needs a local qcow2 registered in ~/.config/linux-system-roles.json, and
# runqemu needs BOTH the image and the playbooks named — with no playbook arguments it has nothing
# to run. The image must be a registered SLE 16.1: the himmelblau packages come from the base
# product, so an unregistered host cannot resolve them.
#
# Passing several playbooks runs them all in ONE VM, sequentially, so every tests_*.yml converges
# the state it needs itself rather than assuming a fresh host.
requires =
    tox-lsr >= 3
envlist =
    black
    yamllint
    ansible-lint

[lsr_config]
# Enable the plugin from the repo, so the commands above work without an explicit --lsr-enable.
# tox-lsr reads this key from THIS section only; under [tox] it is silently ignored.
lsr_enable = true

# Lint against the role's own yamllint config rather than tox-lsr's vendored default, so a local
# `tox -e yamllint` matches what .github/workflows/ansible-lint.yml runs in CI. ansible-lint finds
# .ansible-lint by itself and needs no equivalent setting here.
[lsr_yamllint]
configfile = {toxinidir}/.yamllint.yml
configbasename = .yamllint.yml
