---
# vars/Suse.yml — openSUSE Leap / Tumbleweed / SLE.
# Selected when ansible_facts['os_family'] == "Suse".

__himmelblau_packages:
  - himmelblau
  # virtual capability — the rpm is the soname-versioned libnss_himmelblau*; installing by the
  # stable capability is correct, but never name-check it via package_facts.
  - nss-himmelblau
  - pam-himmelblau
  - himmelblau-sso

__himmelblau_pam_method: pam-config
__himmelblau_sshd_package: himmelblau-sshd-config
