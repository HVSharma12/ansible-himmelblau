---
# Staged rollout: with configure_nss/configure_pam false the role installs and renders
# but wires nothing, an unscoped staged run is refused, and the completing play wires.

- name: Establish an unwired starting point (this file must not assume a fresh VM)
  hosts: all
  become: true
  vars:
    himmelblau_state: absent
    himmelblau_start_services: false
  roles:
    - role: ansible-himmelblau

- name: An unscoped staged run is refused
  hosts: all
  become: true
  tasks:
    - name: Converge with the wiring toggles off and no scoping
      block:
        - name: Apply the role (expect the login-scoping guard)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_configure_nss: false
            himmelblau_configure_pam: false
            himmelblau_start_services: false

        - name: Fail if the guard stood aside
          ansible.builtin.fail:
            msg: >-
              The role converged an unscoped config because configure_pam was false. On a host
              wired by an earlier run that config admits every tenant user.
      rescue:
        - name: Assert the refusal was the login-scoping guard
          ansible.builtin.assert:
            that:
              - "'unscoped login' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              The converge failed, but not on the login-scoping guard:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true

- name: Stage the rollout — install and render, wire nothing
  hosts: all
  become: true
  vars:
    himmelblau_domain: example.onmicrosoft.com
    himmelblau_configure_nss: false
    himmelblau_configure_pam: false
    # The staged rollout defers the WIRING, not the scoping decision.
    himmelblau_pam_allow_no_groups: true
    himmelblau_start_services: false
  roles:
    - role: ansible-himmelblau

- name: Verify the staged run installed and rendered but wired nothing
  hosts: all
  become: true
  tasks:
    - name: Read the rendered config
      ansible.builtin.slurp:
        src: /etc/himmelblau/himmelblau.conf
      register: __staged_conf

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Stat /etc/nsswitch.conf
      ansible.builtin.stat:
        path: /etc/nsswitch.conf
      register: __staged_nsswitch_stat

    # The file legitimately may not exist yet: SLE 16 ships nsswitch.conf only under /usr/etc, and
    # the role seeds /etc from it inside nss.yml — which this run skipped. Absent is therefore a
    # PASS for "NSS was not wired", and the read below is conditional rather than assumed.
    - name: Read /etc/nsswitch.conf when it exists
      ansible.builtin.slurp:
        src: /etc/nsswitch.conf
      register: __staged_nsswitch
      when: __staged_nsswitch_stat.stat.exists

    - name: Query pam-config for himmelblau
      ansible.builtin.command: pam-config --query --himmelblau
      register: __staged_pam
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the staged run installed and rendered
      ansible.builtin.assert:
        that:
          - "'domain = example.onmicrosoft.com' in (__staged_conf.content | b64decode)"
          - "'himmelblau' in ansible_facts.packages"
        fail_msg: >-
          The staged run did not do its half of the job: with the wiring toggles off it must still
          install the packages and render himmelblau.conf.
        quiet: true

    - name: Assert the staged run wired NOTHING
      ansible.builtin.assert:
        that:
          # NSS: either the file was never seeded, or it exists and carries no himmelblau source.
          - >-
            not __staged_nsswitch_stat.stat.exists
            or 'himmelblau' not in (__staged_nsswitch.content | b64decode)
          # PAM: pam-config must not know about himmelblau at all.
          - __staged_pam.stdout | trim | length == 0
        fail_msg: >-
          himmelblau_configure_nss/himmelblau_configure_pam were false, but the role wired NSS or
          PAM anyway. That breaks the documented staged rollout and wires a login path the operator
          deliberately deferred.
        quiet: true

    # The staged shape renders himmelblau.conf on a path no other file in the suite converges, so
    # its idempotency is proven nowhere else. The qemu runner does not double-run, so converge it a
    # second time here and assert no drift.
    - name: Snapshot himmelblau.conf before the second staged converge
      ansible.builtin.stat:
        path: /etc/himmelblau/himmelblau.conf
        checksum_algorithm: sha256
      register: __staged_before

    - name: Converge the staged shape a SECOND time
      ansible.builtin.include_role:
        name: ansible-himmelblau
      vars:
        himmelblau_domain: example.onmicrosoft.com
        himmelblau_configure_nss: false
        himmelblau_configure_pam: false
        himmelblau_pam_allow_no_groups: true
        himmelblau_start_services: false

    - name: Re-stat himmelblau.conf after the second staged converge
      ansible.builtin.stat:
        path: /etc/himmelblau/himmelblau.conf
        checksum_algorithm: sha256
      register: __staged_after

    - name: Re-probe NSS and PAM after the second staged converge
      ansible.builtin.stat:
        path: /etc/nsswitch.conf
      register: __staged2_nsswitch_stat

    - name: Read /etc/nsswitch.conf after the second staged converge, when it exists
      ansible.builtin.slurp:
        src: /etc/nsswitch.conf
      register: __staged2_nsswitch
      when: __staged2_nsswitch_stat.stat.exists

    - name: Query pam-config after the second staged converge
      ansible.builtin.command: pam-config --query --himmelblau
      register: __staged2_pam
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the staged shape is idempotent AND still wired nothing
      ansible.builtin.assert:
        that:
          - __staged_after.stat.checksum == __staged_before.stat.checksum
          # A staged re-converge must not wire NSS or PAM either.
          - >-
            not __staged2_nsswitch_stat.stat.exists
            or 'himmelblau' not in (__staged2_nsswitch.content | b64decode)
          - __staged2_pam.stdout | trim | length == 0
        fail_msg: >-
          A second converge of the staged shape rewrote himmelblau.conf, or wired NSS or PAM that
          the first staged converge correctly left alone.
        quiet: true

- name: Complete the rollout — now wire NSS and PAM
  hosts: all
  become: true
  vars:
    himmelblau_domain: example.onmicrosoft.com
    himmelblau_configure_nss: true
    himmelblau_configure_pam: true
    himmelblau_pam_allow_no_groups: true
    himmelblau_start_services: false
  roles:
    - role: ansible-himmelblau

- name: Verify the completing run wired what the staged run withheld
  hosts: all
  become: true
  tasks:
    - name: Read /etc/nsswitch.conf
      ansible.builtin.slurp:
        src: /etc/nsswitch.conf
      register: __wired_nsswitch

    - name: Query pam-config for himmelblau
      ansible.builtin.command: pam-config --query --himmelblau
      register: __wired_pam
      changed_when: false
      failed_when: false
      check_mode: false

    # This is what makes the previous play's absence asserts non-vacuous: the same role, on the
    # same host, with only the toggles changed, DOES wire both.
    - name: Assert NSS and PAM are wired once the toggles are on
      ansible.builtin.assert:
        that:
          - "'himmelblau' in (__wired_nsswitch.content | b64decode)"
          - __wired_pam.stdout | trim | length > 0
        fail_msg: >-
          Turning the toggles back on did not wire NSS/PAM — so the staged run's "wired nothing"
          asserts proved nothing about the toggles.
        quiet: true
