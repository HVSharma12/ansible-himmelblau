---
# Check-mode safety on a converged host: damage each managed file in a way a real
# converge repairs, dry-run, assert the damage stayed, then repair in always:. The check_mode
# keyword does not set ansible_check_mode, so a genuine --check runs in tests_restart_handler.yml.

- name: Converge for real, so there is a converged host to damage and dry-run against
  hosts: all
  become: true
  vars:
    himmelblau_domain: example.onmicrosoft.com
    himmelblau_pam_allow_no_groups: true
    himmelblau_start_services: false
  roles:
    - role: ansible-himmelblau

- name: Damage, dry-run and verify — with the repair guaranteed
  hosts: all
  become: true
  vars_files:
    - vars/pam_account_control.yml
  tasks:
    - name: Damage the managed files, dry-run over them, and prove nothing was written
      block:
        # All three damage tasks carry check_mode: false. Without it, a --check invocation would
        # skip the damage and the by-content assert below would fail — belt and braces, so that
        # failure mode is impossible rather than merely loud.

        # The template re-renders wholesale, so an added line cannot survive a real converge.
        - name: Add a sentinel line to himmelblau.conf
          ansible.builtin.lineinfile:
            path: /etc/himmelblau/himmelblau.conf
            line: "# CHECK-MODE SENTINEL — a real converge re-renders this file and drops this line"
            insertafter: EOF
          check_mode: false

        # tasks/nss.yml re-appends the token to any database line that lacks it.
        - name: Strip the himmelblau source from the passwd database
          ansible.builtin.replace:
            path: /etc/nsswitch.conf
            regexp: '^(passwd:.*?)\s+himmelblau\b(.*)$'
            replace: '\1\2'
          check_mode: false

        # `required` is repairable damage that still denies out-of-group users; never `sufficient`.
        - name: Seed the pam-config `required` account control
          community.general.pamd:
            name: common-account
            type: account
            control: "[success=ok auth_err=die default=ignore]"
            module_path: pam_himmelblau.so
            new_control: required
          check_mode: false

        - name: Read the damaged files back
          ansible.builtin.slurp:
            src: "{{ __src }}"
          loop:
            - /etc/himmelblau/himmelblau.conf
            - /etc/nsswitch.conf
            - /etc/pam.d/common-account
          loop_control:
            loop_var: __src
          register: __damaged_content

        # A damage task that misses its pattern is a silent no-op, which would make this vacuous.
        - name: Assert each damage actually landed, by content
          ansible.builtin.assert:
            that:
              - "'CHECK-MODE SENTINEL' in (__damaged_content.results[0].content | b64decode)"
              - >-
                (__damaged_content.results[1].content | b64decode)
                | regex_search('(?m)^passwd:.*himmelblau') is none
              - >-
                (__damaged_content.results[2].content | b64decode)
                | regex_search(__legacy_ctl_re) is not none
            fail_msg: >-
              At least one damage did not land, so the comparison below would compare a converged
              file against itself and pass without measuring anything.
            quiet: true

        - name: Checksum the damaged files
          ansible.builtin.stat:
            path: "{{ __managed }}"
            checksum_algorithm: sha256
            # common-account is a SYMLINK on SLE 16 and stat does not follow links by default —
            # without this it returns no checksum for that entry at all, and the comparison below
            # comes out undefined rather than equal.
            follow: true
          loop:
            - /etc/himmelblau/himmelblau.conf
            - /etc/nsswitch.conf
            - /etc/pam.d/common-account
          loop_control:
            loop_var: __managed
          register: __damaged

        - name: Assert every damaged file carries a checksum to compare against
          ansible.builtin.assert:
            that:
              - __damaged.results | map(attribute='stat.exists') | list | unique == [true]
              - >-
                __damaged.results
                | map(attribute='stat.checksum', default='') | select('eq', '')
                | list | length == 0
            fail_msg: >-
              A managed file is missing or could not be checksummed, so the comparison below would
              be vacuous.
            quiet: true

        # The keyword goes on this inner block: it is not valid on include_role, and it does reach
        # the role's own tasks from here (measured).
        - name: Dry-run the role over the damaged host
          check_mode: true
          block:
            # Completing is half the contract: no task may error just because it was told to
            # preview rather than act. Leaving the damage alone is the other half.
            - name: Apply the role in check mode
              ansible.builtin.include_role:
                name: ansible-himmelblau
              vars:
                himmelblau_domain: example.onmicrosoft.com
                himmelblau_pam_allow_no_groups: true
                himmelblau_start_services: false

        - name: Re-checksum the managed files after the dry run
          ansible.builtin.stat:
            path: "{{ __managed }}"
            checksum_algorithm: sha256
            follow: true
          loop:
            - /etc/himmelblau/himmelblau.conf
            - /etc/nsswitch.conf
            - /etc/pam.d/common-account
          loop_control:
            loop_var: __managed
          register: __after_dry

        # The assertion the whole file exists for, and unlike a plain converged-host comparison it
        # CAN fail: a module that wrote while in check mode would have repaired the damage and
        # moved the checksum.
        - name: Assert the dry run wrote nothing — every file is still damaged
          ansible.builtin.assert:
            that:
              - >-
                (__after_dry.results | map(attribute='stat.checksum') | list)
                == (__damaged.results | map(attribute='stat.checksum') | list)
            fail_msg: >-
              A check-mode run repaired damage on disk. Every module the role uses must preview
              rather than write when it is put in check mode.
            quiet: true

      always:
        # Unconditional: if anything above failed, the host must still be handed on repaired, or
        # every later test file in a shared VM inherits the damage.
        - name: Repair for real
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_pam_allow_no_groups: true
            himmelblau_start_services: false

        - name: Read the repaired files
          ansible.builtin.slurp:
            src: "{{ __src }}"
          loop:
            - /etc/himmelblau/himmelblau.conf
            - /etc/nsswitch.conf
            - /etc/pam.d/common-account
          loop_control:
            loop_var: __src
          register: __repaired

        # Also the non-vacuity proof for the assert above: damage the role cannot repair would sit
        # unchanged through the dry run for the wrong reason.
        - name: Assert the real converge undid all three kinds of damage
          ansible.builtin.assert:
            that:
              - "'CHECK-MODE SENTINEL' not in (__repaired.results[0].content | b64decode)"
              - >-
                (__repaired.results[1].content | b64decode)
                | regex_search('(?m)^passwd:.*himmelblau') is not none
              - >-
                (__repaired.results[2].content | b64decode)
                | regex_search(__account_ctl_re) is not none
            fail_msg: >-
              The real converge did not repair the damage, so "the dry run changed nothing" proved
              nothing — the damage was simply not repairable.
            quiet: true

- name: Guards still refuse a bad config in check mode
  hosts: all
  become: true
  check_mode: true
  tasks:
    # The pre-flight guards must reject a bad config in a dry run exactly as in a real one.
    - name: Dry-run the role with a bogus himmelblau_state
      block:
        - name: Include the role — should fail at the state enum guard
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_state: prsent
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_pam_allow_no_groups: true
            himmelblau_start_services: false

        - name: Fail the test if the guard did not abort in check mode
          ansible.builtin.fail:
            msg: >-
              The role completed in check mode with an invalid state value. Pre-flight guards must
              refuse a bad config on a dry run exactly as they do on a real one.
      rescue:
        - name: Confirm the abort was the state enum guard
          ansible.builtin.assert:
            that:
              - >-
                'himmelblau_state must be'
                in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              The check-mode run failed, but not at the state enum guard:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true
