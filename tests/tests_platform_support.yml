---
# Supported-platform contract via shadowed facts: legs 1-3 (SLE 15.6, 16.0,
# SLES_SAP) and 5-6 (no vars file) refuse, leg 4 (SL-Micro 16.1) is admitted. Leg 5 pins the PAM
# method, since include_vars from earlier plays persists for the whole run.

- name: Platform guard leg 1 — a pre-16.1 host is refused with the base-product reason
  hosts: all
  become: true
  tasks:
    - name: Converge against injected SLE 15.6 facts
      block:
        - name: Apply the role (expect the supported-platform refusal)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_pam_allow_no_groups: true
            himmelblau_start_services: false
            # os_family keeps the vars dispatch on Suse.yml; distribution/version make the
            # platform assert fire. pkg_mgr is not read before the guard and this leg never gets
            # past it — it is carried only so every leg in this file shadows the same fact set.
            ansible_facts:
              distribution: SLES
              distribution_version: "15.6"
              os_family: Suse
              pkg_mgr: zypper

        # Sentinel message deliberately avoids the guard's asserted phrase, so a regression that
        # lets the role converge cannot satisfy the rescue assert with this sentinel's own text.
        - name: Fail if the platform guard did not trigger
          ansible.builtin.fail:
            msg: >-
              The role completed against injected SLE 15.6 facts — the platform guard must
              refuse releases below the supported floor.
      rescue:
        # Keys on a distinctive fragment of the guard's own fail_msg in tasks/main.yml — the two
        # must be edited together. This fragment names the reason (base-product install) rather
        # than the platform list, which changes as variants are called out.
        - name: Assert the failure is the platform refusal
          ansible.builtin.assert:
            that:
              - >-
                'installs Himmelblau from the SLE 16.1 base product'
                in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              The converge failed, but not with the platform-guard message:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true

- name: Platform guard leg 2 — SLE 16.0 is refused (the near-miss the floor exists for)
  hosts: all
  become: true
  tasks:
    - name: Converge against injected SLE 16.0 facts
      block:
        - name: Apply the role (expect the supported-platform refusal)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_pam_allow_no_groups: true
            himmelblau_start_services: false
            # Same distribution and same major version as a supported host — only the minor is
            # below the floor. Leg 1's 15.6 would still be refused by a major-version comparison;
            # this one would not, which is the regression this leg exists to catch.
            ansible_facts:
              distribution: SLES
              distribution_version: "16.0"
              os_family: Suse
              pkg_mgr: zypper

        - name: Fail if the platform guard did not trigger
          ansible.builtin.fail:
            msg: >-
              The role completed against injected SLE 16.0 facts — Himmelblau is in the base
              product only from 16.1, so the guard must refuse the release just below the floor.
      rescue:
        - name: Assert the failure is the platform refusal
          ansible.builtin.assert:
            that:
              - >-
                'installs Himmelblau from the SLE 16.1 base product'
                in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              The converge failed, but not with the platform-guard message:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true

- name: Platform guard leg 3 — the SAP variant is refused, not silently admitted
  hosts: all
  become: true
  tasks:
    - name: Converge against injected SLES_SAP 16.1 facts
      block:
        - name: Apply the role (expect the supported-platform refusal)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_pam_allow_no_groups: true
            himmelblau_start_services: false
            # The release is new enough; it is the distribution NAME the guard does not admit. The
            # README says these variants are untested rather than known-broken, and this pins that
            # they are refused rather than quietly treated as SLES.
            ansible_facts:
              distribution: SLES_SAP
              distribution_version: "16.1"
              os_family: Suse
              pkg_mgr: zypper

        - name: Fail if the platform guard did not trigger
          ansible.builtin.fail:
            msg: >-
              The role completed against injected SLES_SAP facts — the guard's allow-list names
              only SLES and SL-Micro, so the SAP variant must be refused.
      rescue:
        - name: Assert the failure is the platform refusal
          ansible.builtin.assert:
            that:
              - >-
                'installs Himmelblau from the SLE 16.1 base product'
                in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              The converge failed, but not with the platform-guard message:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true

# The positive counterweight to legs 1/2/3 and 5/6. The Immutable variant is admitted,
# and Ansible reports it as SL-Micro; nothing proved that until now, so an allow-list typo would
# have refused every Immutable host while CI stayed green.
- name: Platform guard leg 4 — SL-Micro 16.1 is ADMITTED and reaches the render
  hosts: all
  become: true
  tasks:
    # The include_role below is NOT rescued: if the guard's allow-list stopped admitting SL-Micro,
    # the platform assert would abort the play. That is this leg's primary contract.
    - name: Converge against injected SL-Micro 16.1 facts
      ansible.builtin.include_role:
        name: ansible-himmelblau
      vars:
        # A domain only this leg writes, so no earlier test can satisfy the render assert.
        himmelblau_domain: slmicro.onmicrosoft.com
        himmelblau_pam_allow_no_groups: true
        himmelblau_start_services: false
        # No vars/SL-Micro.yml exists and none is needed: the first_found dispatch falls through
        # to the os_family file, which is the whole reason SL-Micro needs no distro file of its own.
        ansible_facts:
          distribution: SL-Micro
          distribution_version: "16.1"
          os_family: Suse
          pkg_mgr: zypper

    - name: Read the config rendered for the Immutable variant
      ansible.builtin.slurp:
        src: /etc/himmelblau/himmelblau.conf
      register: __slmicro_conf

    # Packages and PAM method are not asserted: earlier plays' include_vars already made them true.
    - name: Assert the guard admitted SL-Micro and the converge reached the render
      ansible.builtin.assert:
        that:
          - "'domain = slmicro.onmicrosoft.com' in (__slmicro_conf.content | b64decode)"
        fail_msg: >-
          SL-Micro 16.1 did not reach the config render — the platform guard must admit the
          Immutable variant.
        quiet: true

- name: Unsupported PAM method leg 5 — pam.yml must fail loudly, not skip
  hosts: all
  become: true
  tasks:
    # The pin below decides the method; this proves a real host with these facts would also fall
    # through to vars/main.yml.
    - name: Assert no vars file matches the shadowed platform
      ansible.builtin.assert:
        that:
          - >-
            query('first_found',
                  {'files': ['SLES_16.1.yml', 'SLES.yml', 'RedHat.yml'],
                   'paths': [__vars_dir], 'skip': true}) | length == 0
          # Positive control: a broken lookup path would also return [] above.
          - >-
            query('first_found',
                  {'files': ['Suse.yml'], 'paths': [__vars_dir], 'skip': true}) | length == 1
        fail_msg: >-
          Either a vars file now matches these shadowed facts — so the role would no longer fall
          through to vars/main.yml and this leg's premise is false — or {{ __vars_dir }} is not the
          role's vars directory, in which case the no-match check above proved nothing.
        quiet: true
      vars:
        __vars_dir: "{{ playbook_dir }}/roles/ansible-himmelblau/vars"

    - name: Converge on a family with no vars file, with the PAM method pinned to "manual"
      block:
        - name: Apply the role (expect the PAM-method refusal)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_start_services: false
            # NSS wiring off so the leg stops at pam.yml rather than editing nsswitch on the way.
            himmelblau_configure_nss: false
            # An already-installed package, so install.yml is a genuine no-op: this leg is about
            # the PAM refusal, not about dragging in a package set. This is also the only coverage
            # the himmelblau_packages override has.
            himmelblau_packages:
              - bash
            # Pinned: an earlier play's vars/Suse.yml would otherwise leave "pam-config" in scope.
            __himmelblau_pam_method: manual
            # No vars/RedHat.yml matches; pkg_mgr is kept so the package module finds its backend.
            ansible_facts:
              distribution: SLES
              distribution_version: "16.1"
              os_family: RedHat
              pkg_mgr: zypper

        - name: Fail if the PAM-method guard did not trigger
          ansible.builtin.fail:
            msg: >-
              The role completed with no pam-config method available. Wiring PAM is a security
              step: it must abort loudly rather than no-op, or an operator believes login is
              scoped when nothing was configured.
      rescue:
        - name: Assert the failure is the PAM-method refusal
          ansible.builtin.assert:
            that:
              - >-
                'only implemented via pam-config'
                in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              The converge failed, but not with the PAM-method message:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true

        # Unscoped and not pam-config: the scoping guard must stand aside for the clearer error.
        - name: Assert the login-scoping guard stood aside rather than aborting first
          ansible.builtin.assert:
            that:
              - "'unscoped login' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              The login-scoping guard fired on a platform where PAM wiring is unsupported. It is
              gated on __himmelblau_pam_method so the clearer pam.yml error surfaces instead.
            quiet: true

- name: Unsupported SSH platform leg 6 — ssh.yml must fail loudly, not skip
  hosts: all
  become: true
  tasks:
    - name: Converge the same host with PAM off so the run reaches ssh.yml
      block:
        - name: Apply the role with SSH enrolment opted in (expect the SSH refusal)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_domain: example.onmicrosoft.com
            himmelblau_start_services: false
            himmelblau_configure_nss: false
            # PAM off, or leg 5's refusal fires first and this leg never reaches ssh.yml.
            himmelblau_configure_pam: false
            # The login-scoping guard applies with PAM off too.
            himmelblau_pam_allow_no_groups: true
            himmelblau_configure_ssh: true
            himmelblau_packages:
              - bash
            ansible_facts:
              distribution: SLES
              distribution_version: "16.1"
              os_family: RedHat
              pkg_mgr: zypper

        - name: Fail if the SSH-platform guard did not trigger
          ansible.builtin.fail:
            msg: >-
              The role completed with configure_ssh opted in on a family it cannot wire. Enabling
              SSH auth is security-relevant, so it must abort rather than silently no-op.
      rescue:
        - name: Assert the failure is the SSH-platform refusal
          ansible.builtin.assert:
            that:
              - >-
                'only implemented for SUSE'
                in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              The converge failed, but not with the SSH-platform message:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true
