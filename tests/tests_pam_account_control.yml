---
# PAM account control, daemons down: repair of seeded legacy controls, configure_pam
# false accepting denying lines and refusing the rest, idempotency, and a real local
# `su` login. ⚠️ Full converge — disposable CI VM only.

- name: Wire himmelblau into PAM with the daemons down (tenant-less)
  hosts: all
  become: true
  vars:
    himmelblau_domain: example.onmicrosoft.com
    # Explicit allow-all opt-in satisfies the login-scoping guard without a tenant.
    himmelblau_pam_allow_no_groups: true
    himmelblau_start_services: false
  roles:
    - role: ansible-himmelblau

- name: Assert the account control, repair both legacy forms, and measure a local login
  hosts: all
  become: true
  vars_files:
    - vars/pam_account_control.yml
  vars:
    # Same role inputs for the in-play re-converges.
    himmelblau_domain: example.onmicrosoft.com
    himmelblau_pam_allow_no_groups: true
    himmelblau_start_services: false
    __probe_target: hb-probe-target
    __probe_caller: hb-probe-caller
    __probe_script: /usr/local/sbin/pam_local_auth_probe.py
    __probe_argv:
      - python3
      - "{{ __probe_script }}"
      - --run-as
      - "{{ __probe_caller }}"
      - -c
      - id -un
      - -t
      - "90"
      - "{{ __probe_target }}"
  tasks:
    # The always: below restores the host, so a failure never leaves a seeded `sufficient` or the
    # probe accounts behind for later test files in a shared VM.
    - name: Seed, repair and measure the account control
      block:
        # ---- Leg 1: the converged state ------------------------------------------------------
        - name: Read common-account after the first converge
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_converged

        - name: Assert the upstream-declared control is present and no legacy form survives
          ansible.builtin.assert:
            that:
              - (__acct_converged.content | b64decode) is search(__account_ctl_re)
              - not ((__acct_converged.content | b64decode) is search(__legacy_ctl_re))
            fail_msg: >-
              common-account does not carry [success=ok auth_err=die default=ignore] for
              pam_himmelblau.so, or a legacy required/sufficient line survives:
              {{ __acct_converged.content | b64decode }}
            quiet: true

        # ---- Leg 2: a host converged by 1.1.x carries `sufficient` ------------------------
        - name: Seed the 1.1.x sufficient control (simulate a host converged by an earlier release)
          community.general.pamd:
            name: common-account
            type: account
            control: "[success=ok auth_err=die default=ignore]"
            module_path: pam_himmelblau.so
            new_control: sufficient

        - name: Read common-account with the 1.1.x control seeded
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_seeded

        - name: Assert the seed took (the repair leg cannot pass vacuously)
          ansible.builtin.assert:
            that:
              - >-
                (__acct_seeded.content | b64decode)
                is search('account\s+sufficient\s+pam_himmelblau')
            fail_msg: >-
              Seeding the 1.1.x sufficient control failed — the repair leg would be vacuous.
            quiet: true

        - name: Converge with PAM wiring off over the 1.1.x stack (expect a refusal)
          block:
            - name: Include the role with himmelblau_configure_pam false
              ansible.builtin.include_role:
                name: ansible-himmelblau
              vars:
                himmelblau_configure_pam: false

            - name: Fail if the role left the 'sufficient' line in force unreported
              ansible.builtin.fail:
                msg: A configure_pam=false run accepted a wired 'sufficient' account line.
          rescue:
            - name: Assert the refusal came from the wired-stack check
              ansible.builtin.assert:
                that:
                  - "'does not deny' in (ansible_failed_result.msg | default(''))"
                fail_msg: "Got: {{ ansible_failed_result.msg | default('(no msg)') }}"
                quiet: true

        - name: Read common-account after the refused run
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_after_refusal

        - name: Assert the refused run left the stack as it was
          ansible.builtin.assert:
            that:
              - >-
                (__acct_after_refusal.content | b64decode)
                is search('(?m)^account\s+sufficient\s+pam_himmelblau')
            fail_msg: The configure_pam=false run changed common-account.
            quiet: true

        - name: Seed the same control with the optional `-account` prefix
          ansible.builtin.replace:
            path: /etc/pam.d/common-account
            regexp: '^account(\s+sufficient\s+pam_himmelblau\.so)'
            replace: '-account\1'
          check_mode: false
          register: __acct_dash_seed

        - name: Assert the `-account` seed took (the leg cannot pass on the plain line)
          ansible.builtin.assert:
            that:
              - __acct_dash_seed is changed
            fail_msg: The `-account` seed matched nothing, so this leg would test the plain line.
            quiet: true

        - name: Converge with PAM wiring off over `-account sufficient` (expect a refusal)
          block:
            - name: Include the role with himmelblau_configure_pam false
              ansible.builtin.include_role:
                name: ansible-himmelblau
              vars:
                himmelblau_configure_pam: false

            - name: Fail if the role accepted the prefixed 'sufficient' line
              ansible.builtin.fail:
                msg: A configure_pam=false run accepted `-account sufficient pam_himmelblau.so`.
          rescue:
            - name: Assert the prefixed line was refused by the wired-stack check
              ansible.builtin.assert:
                that:
                  - "'does not deny' in (ansible_failed_result.msg | default(''))"
                fail_msg: "Got: {{ ansible_failed_result.msg | default('(no msg)') }}"
                quiet: true

        - name: Drop the `-account` prefix again
          ansible.builtin.replace:
            path: /etc/pam.d/common-account
            regexp: '^-account(\s+sufficient\s+pam_himmelblau\.so)'
            replace: 'account\1'
          check_mode: false

        - name: Re-converge the role over the 1.1.x stack
          ansible.builtin.include_role:
            name: ansible-himmelblau

        - name: Read common-account after the repair converge
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_repaired_sufficient

        - name: Assert the 1.1.x sufficient line was repaired to the upstream-declared control
          ansible.builtin.assert:
            that:
              - (__acct_repaired_sufficient.content | b64decode) is search(__account_ctl_re)
              - not ((__acct_repaired_sufficient.content | b64decode) is search(__legacy_ctl_re))
            fail_msg: >-
              A 1.1.x sufficient himmelblau account line survived a re-converge — hosts
              converged by an earlier release would keep the login-scoping bypass. Stack:
              {{ __acct_repaired_sufficient.content | b64decode }}
            quiet: true

        # ---- Leg 3: an external pam-config run regenerates `required` ---------------------------
        # check_mode: false — this seeds the state the leg asserts on; skipping it under --check
        # would make the premise assert below fail for the wrong reason.
        - name: Regenerate the stack with pam-config, as a package update or an admin would
          ansible.builtin.command: pam-config --add --himmelblau
          changed_when: true
          check_mode: false

        - name: Read common-account after the external pam-config run
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_regen

        - name: Assert pam-config regenerated the hardcoded 'required' control (premise of the leg)
          ansible.builtin.assert:
            that:
              - (__acct_regen.content | b64decode) is search('account\s+required\s+pam_himmelblau')
            fail_msg: >-
              pam-config --add --himmelblau did not regenerate `account required
              pam_himmelblau.so` on this image, so the premise the decision trail
              records no longer holds here; re-examine before trusting the
              repair leg. Stack: {{ __acct_regen.content | b64decode }}
            quiet: true

        - name: Converge with PAM wiring off over the denying 'required' line (must pass)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_configure_pam: false

        - name: Re-converge the role over the regenerated stack
          ansible.builtin.include_role:
            name: ansible-himmelblau

        - name: Read common-account after the second repair converge
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_repaired_required

        - name: Assert the regenerated 'required' line was repaired to the upstream-declared control
          ansible.builtin.assert:
            that:
              - (__acct_repaired_required.content | b64decode) is search(__account_ctl_re)
              - not ((__acct_repaired_required.content | b64decode) is search(__legacy_ctl_re))
            fail_msg: >-
              pam-config's regenerated 'required' line survived a re-converge. Stack:
              {{ __acct_repaired_required.content | b64decode }}
            quiet: true

        # ---- Leg 3b: the plugin file's own `[success=end …]` (a pam-config >= 2.14 future) -
        # pamd rejects `end` and validates the whole file, so seed it with replace and assert the
        # role repairs it.
        - name: Seed the plugin file's `[success=end …]` control (a future pam-config would emit it)
          ansible.builtin.replace:
            path: /etc/pam.d/common-account
            regexp: '^(account\s+\[success=)ok( auth_err=die default=ignore\]\s+pam_himmelblau\.so)'
            replace: '\1end\2'
          check_mode: false

        - name: Read common-account with the `end` control seeded
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_seeded_end

        - name: Assert the `end` control is in place (the repair leg cannot pass vacuously)
          ansible.builtin.assert:
            that:
              - (__acct_seeded_end.content | b64decode) is search('account\s+\[success=end ')
            fail_msg: >-
              Seeding the `[success=end …]` control failed — the repair leg would be vacuous.
            quiet: true

        - name: Re-converge over the `end`-shaped stack
          ansible.builtin.include_role:
            name: ansible-himmelblau

        - name: Read common-account after the `end` repair converge
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_repaired_end

        - name: Assert the `[success=end …]` line was repaired to the upstream-declared control
          ansible.builtin.assert:
            that:
              - (__acct_repaired_end.content | b64decode) is search(__account_ctl_re)
              - not ((__acct_repaired_end.content | b64decode) is search('success=end'))
            fail_msg: >-
              A `[success=end …]` himmelblau account line was not repaired — a plugin-honouring
              pam-config could leave the role's pamd task hard-failing. Stack:
              {{ __acct_repaired_end.content | b64decode }}
            quiet: true

        # ---- Leg 4: idempotency ----------------------------------------------------------------
        - name: Converge once more on the already-repaired stack
          ansible.builtin.include_role:
            name: ansible-himmelblau

        - name: Read common-account after the idempotency converge
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_idempotent

        - name: Assert the repaired stack is byte-identical after another converge (idempotent)
          ansible.builtin.assert:
            that:
              - __acct_idempotent.content == __acct_repaired_end.content
            fail_msg: >-
              The account control rewrite is not idempotent — common-account changed on a
              re-converge.
            quiet: true

        - name: Query pam-config for himmelblau after the idempotency converge
          ansible.builtin.command: pam-config --query --himmelblau
          register: __acct_idempotent_query
          changed_when: false

        - name: Assert himmelblau is still wired after the rewrite
          ansible.builtin.assert:
            that:
              - __acct_idempotent_query.stdout | trim | length > 0
            fail_msg: pam-config no longer reports himmelblau after the account control rewrite.
            quiet: true

        - name: Converge with PAM wiring off over the declared control (must pass)
          ansible.builtin.include_role:
            name: ansible-himmelblau
          vars:
            himmelblau_configure_pam: false

        # Allow-list enforcement lives in the account phase, so auth-only wiring admits everyone.
        - name: Comment out the himmelblau account line, leaving auth wired
          ansible.builtin.replace:
            path: /etc/pam.d/common-account
            regexp: '^(account\s+\[success=ok auth_err=die default=ignore\]\s+pam_himmelblau\.so)'
            replace: '# \1'
          check_mode: false

        - name: Converge with PAM wiring off over auth-only wiring (expect a refusal)
          block:
            - name: Include the role with himmelblau_configure_pam false
              ansible.builtin.include_role:
                name: ansible-himmelblau
              vars:
                himmelblau_configure_pam: false

            - name: Fail if the role accepted auth-only wiring
              ansible.builtin.fail:
                msg: A configure_pam=false run accepted pam_himmelblau with no account line.
          rescue:
            - name: Assert auth-only wiring was refused by the wired-stack check
              ansible.builtin.assert:
                that:
                  - "'does not deny' in (ansible_failed_result.msg | default(''))"
                fail_msg: "Got: {{ ansible_failed_result.msg | default('(no msg)') }}"
                quiet: true

        - name: Restore the commented account line
          ansible.builtin.replace:
            path: /etc/pam.d/common-account
            regexp: '^# (account\s+\[success=ok auth_err=die default=ignore\]\s+pam_himmelblau\.so)'
            replace: '\1'
          check_mode: false

        - name: Read common-account after restoring the account line
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_uncommented

        - name: Assert the stack is back to the converged bytes
          ansible.builtin.assert:
            that:
              - __acct_uncommented.content == __acct_repaired_end.content
            fail_msg: Uncommenting the account line did not restore common-account.
            quiet: true

        # ---- Leg 5: a real local password login through the wired stack, daemons down -----------
        - name: Generate a throwaway password for the probe accounts (never logged)
          ansible.builtin.set_fact:
            __probe_pw: >-
              {{ lookup('ansible.builtin.password', '/dev/null', length=24,
                 chars=['ascii_letters', 'digits']) }}
          no_log: true

        - name: Create the probe accounts (login target + non-root caller)
          ansible.builtin.user:
            name: "{{ __probe_user }}"
            shell: /bin/bash
            create_home: true
          loop:
            - "{{ __probe_target }}"
            - "{{ __probe_caller }}"
          loop_control:
            loop_var: __probe_user

        # chpasswd hashes on the target, so the control node needs neither passlib nor crypt. The
        # command module appends its own newline to stdin, so the value must not end with one —
        # chpasswd rejects an empty trailing line ("line is too short").
        - name: Set the probe accounts' password
          ansible.builtin.command:
            cmd: chpasswd
            stdin: "{{ __probe_target }}:{{ __probe_pw }}\n{{ __probe_caller }}:{{ __probe_pw }}"
          register: __chpasswd
          changed_when: true
          failed_when: false
          check_mode: false
          no_log: true

        # chpasswd's stderr names line numbers, never the password, so it is safe to surface.
        - name: Assert the probe passwords were set
          ansible.builtin.assert:
            that:
              - __chpasswd.rc == 0
            fail_msg: "chpasswd failed (rc={{ __chpasswd.rc }}): {{ __chpasswd.stderr }}"
            quiet: true

        - name: Install the pty login probe
          ansible.builtin.copy:
            src: files/pam_local_auth_probe.py
            dest: "{{ __probe_script }}"
            owner: root
            group: root
            mode: "0755"

        - name: Confirm the daemons are down for the lock-out leg
          ansible.builtin.service_facts:

        - name: Assert himmelblaud is not running (the leg must reproduce the worst case)
          ansible.builtin.assert:
            that:
              - >-
                (ansible_facts.services['himmelblaud.service'].state | default('stopped'))
                != 'running'
            fail_msg: himmelblaud is running — this leg must run with the daemon down.
            quiet: true

        - name: Log in as the local target through su with the RIGHT password (daemons down)
          ansible.builtin.command:
            argv: "{{ __probe_argv }}"
            stdin: "{{ __probe_pw }}"
          register: __login_ok
          changed_when: false
          failed_when: false
          check_mode: false
          no_log: true

        - name: Show the (password-free) transcript of the successful-login probe
          ansible.builtin.debug:
            msg: >-
              rc={{ __login_ok.rc }} stderr={{ __login_ok.stderr }}
              stdout={{ __login_ok.stdout }}

        - name: Assert a local user still logs in through the himmelblau-wired stack
          ansible.builtin.assert:
            that:
              - __login_ok.rc == 0
              - __probe_target in __login_ok.stdout
            fail_msg: >-
              Local password login FAILED through the wired PAM stack with himmelblaud down
              (probe rc={{ __login_ok.rc }}; 124 = conversation timed out). This is the lock-out the
              role must never cause. See the transcript above.
            quiet: true

        - name: Attempt the same login with a WRONG password (the probe must be able to fail)
          ansible.builtin.command:
            argv: "{{ __probe_argv }}"
            stdin: "definitely-not-{{ __probe_pw[:6] }}-the-password"
          register: __login_wrong
          changed_when: false
          failed_when: false
          check_mode: false
          no_log: true

        - name: Show the (password-free) transcript of the wrong-password probe
          ansible.builtin.debug:
            msg: "rc={{ __login_wrong.rc }} stderr={{ __login_wrong.stderr }}"

        - name: Assert the wrong password was refused (the login leg is not vacuous)
          ansible.builtin.assert:
            that:
              - __login_wrong.rc == 1
            fail_msg: >-
              A wrong password was NOT refused (probe rc={{ __login_wrong.rc }}) — either the stack
              accepts anything or the probe cannot observe a refusal; the successful-login leg above
              proves nothing until this is fixed.
            quiet: true

      always:
        # The converge below cannot re-add a commented line or match a `-account` one.
        - name: Undo the comment and prefix seeds if a leg failed between seed and undo
          ansible.builtin.replace:
            path: /etc/pam.d/common-account
            regexp: "{{ __seed.regexp }}"
            replace: '\1'
          loop:
            - regexp: '^# (account\s+\[success=ok [^]]*\]\s+pam_himmelblau\.so)'
            - regexp: '^-(account\s+sufficient\s+pam_himmelblau\.so)'
          loop_control:
            loop_var: __seed
          check_mode: false

        # Unconditional. Re-converging rewrites whatever control is on disk to the
        # upstream-declared one, so the host is handed on safe however this play ended.
        - name: Restore the declared account control
          ansible.builtin.include_role:
            name: ansible-himmelblau

        - name: Read common-account after the restoring converge
          ansible.builtin.slurp:
            src: /etc/pam.d/common-account
          register: __acct_restored

        - name: Assert no legacy control was left behind
          ansible.builtin.assert:
            that:
              - (__acct_restored.content | b64decode) is search(__account_ctl_re)
              - not ((__acct_restored.content | b64decode) is search(__legacy_ctl_re))
            fail_msg: >-
              A legacy himmelblau account control survived this play. On `sufficient` that is
              the login-scoping bypass, and it must never be left on a host by a failed run.
              Stack: {{ __acct_restored.content | b64decode }}
            quiet: true

        - name: Remove the probe accounts and their home directories
          ansible.builtin.user:
            name: "{{ __probe_user }}"
            state: absent
            remove: true
            force: true
          loop:
            - "{{ __probe_target }}"
            - "{{ __probe_caller }}"
          loop_control:
            loop_var: __probe_user

        - name: Remove the pty login probe
          ansible.builtin.file:
            path: "{{ __probe_script }}"
            state: absent
