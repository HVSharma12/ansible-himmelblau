---
# Minimal Entra ID deployment, login scoped to one Entra group.
#
# The role refuses to configure PAM unless login is scoped with
# himmelblau_pam_allow_groups (or allow-all login is explicitly accepted with
# himmelblau_pam_allow_no_groups: true). Keep an independent root session open
# the first time you enrol a host.
- name: Deploy Himmelblau with login scoped to one Entra group
  hosts: workstations
  become: true
  vars:
    himmelblau_domain: contoso.onmicrosoft.com
    himmelblau_app_id: d023f7aa-d214-4b59-911d-6074de623765  # Entra app registration
    himmelblau_pam_allow_groups:
      - f3c9a7e4-7d5a-47e8-832f-3d2d92abcd12  # "Linux Users" Entra group GUID
    himmelblau_local_groups:
      - wheel
  roles:
    - role: ansible-himmelblau
